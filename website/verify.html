<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Document | Haven</title>
  <meta name="description" content="Verify the authenticity of a Haven estate planning summary.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23453A70'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='62' font-weight='bold' fill='%23F8F9FA' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
  <style>
    .verify-container {
      max-width: 560px;
      margin: 120px auto 80px;
      padding: 0 20px;
      text-align: center;
    }
    .verify-card {
      background: var(--cream-light, #FCFCFD);
      border: 1px solid var(--beige-300, #D8DADF);
      border-radius: 16px;
      padding: 40px 32px;
      margin-top: 32px;
    }
    .verify-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    .verify-icon.success { background: rgba(34, 139, 34, 0.1); }
    .verify-icon.error { background: rgba(220, 53, 69, 0.1); }
    .verify-icon.expired { background: rgba(255, 193, 7, 0.1); }
    .verify-title {
      font-family: Georgia, 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--navy, #453A70);
      margin-bottom: 12px;
    }
    .verify-message {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 15px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .verify-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--beige-300, #D8DADF);
    }
    .verify-meta-row {
      display: flex;
      justify-content: space-between;
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 13px;
    }
    .verify-meta-label { color: #999; }
    .verify-meta-value { color: var(--navy, #453A70); font-weight: 500; }
    .verify-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px;
      color: #999;
      font-family: -apple-system, 'Inter', sans-serif;
    }
    .verify-note {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 12px;
      color: #999;
      margin-top: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #D8DADF;
      border-top-color: #453A70;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <div class="nav-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="38" height="38">
          <rect width="100" height="100" rx="22" fill="#453A70"/>
          <text x="50" y="68" font-family="Georgia,serif" font-size="62" font-weight="bold" fill="#F8F9FA" text-anchor="middle">H</text>
        </svg>
      </div>
      <span class="nav-logo-text">Haven</span>
    </a>
    <div class="nav-links">
      <a href="/#features" class="nav-link-text">Features</a>
      <a href="security.html" class="nav-link-text">Security</a>
      <a href="https://testflight.apple.com/join/sw4xWsTA" class="nav-cta">Download Beta</a>
    </div>
  </div>
</nav>

<div class="verify-container">
  <h1 class="verify-title" style="font-size: 28px; margin-bottom: 8px;">Document Verification</h1>
  <p class="verify-message" style="margin-bottom: 0;">Confirm the authenticity of a Haven estate planning summary.</p>

  <div id="verify-result">
    <div class="verify-loading">
      <div class="spinner"></div>
      <span>Verifying...</span>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <div class="footer-brand">
      <div class="footer-brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="34" height="34">
          <rect width="100" height="100" rx="22" fill="rgba(255,255,255,0.15)"/>
          <text x="50" y="68" font-family="Georgia,serif" font-size="56" font-weight="bold" fill="rgba(255,255,255,0.9)" text-anchor="middle">H</text>
        </svg>
      </div>
      <span class="footer-brand-name">Haven</span>
    </div>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="security.html">Security</a>
      <a href="mailto:support@havenhome.dev">Contact</a>
    </div>
  </div>
  <p class="footer-copy">&copy; 2026 Haven Home. All rights reserved.</p>
</footer>

<script>
(async function() {
  const container = document.getElementById('verify-result');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  // Also support /verify/<token> path format
  const pathToken = window.location.pathname.split('/verify/')[1];
  const verificationToken = token || pathToken;

  if (!verificationToken) {
    container.innerHTML = renderError('No verification token provided.', 'Please check the link you received.');
    return;
  }

  try {
    const response = await fetch(
      'https://jsucwnkntdrxhysojgri.supabase.co/functions/v1/verify-estate-export?token=' + encodeURIComponent(verificationToken),
      { headers: { 'Content-Type': 'application/json' } }
    );

    const data = await response.json();

    if (data.valid) {
      container.innerHTML = renderSuccess(data);
    } else if (data.expired || data.max_reached) {
      container.innerHTML = renderExpired(data);
    } else if (data.revoked) {
      container.innerHTML = renderRevoked();
    } else {
      container.innerHTML = renderError('Invalid verification link.', 'This link does not correspond to any Haven document.');
    }
  } catch (err) {
    container.innerHTML = renderError('Unable to verify.', 'Please check your connection and try again.');
  }
})();

function renderSuccess(data) {
  const date = new Date(data.generated_at).toLocaleDateString('en-US', {
    year: 'numeric', month: 'long', day: 'numeric'
  });
  return '<div class="verify-card">' +
    '<div class="verify-icon success">&#10003;</div>' +
    '<div class="verify-title">Verified Estate Planning Summary</div>' +
    '<div class="verify-message">This document was generated through Haven and has not been tampered with.</div>' +
    '<div class="verify-meta">' +
      '<div class="verify-meta-row"><span class="verify-meta-label">Household</span><span class="verify-meta-value">' + escapeHtml(data.household_name) + '</span></div>' +
      '<div class="verify-meta-row"><span class="verify-meta-label">Generated</span><span class="verify-meta-value">' + date + '</span></div>' +
      (data.pdf_hash_truncated ? '<div class="verify-meta-row"><span class="verify-meta-label">Document hash</span><span class="verify-meta-value" style="font-family: monospace;">' + data.pdf_hash_truncated + '...</span></div>' : '') +
      '<div class="verify-meta-row"><span class="verify-meta-label">Views remaining</span><span class="verify-meta-value">' + data.access_remaining + '</span></div>' +
    '</div>' +
    '<div class="verify-note">This verification page does not provide access to the document itself.</div>' +
  '</div>';
}

function renderExpired(data) {
  return '<div class="verify-card">' +
    '<div class="verify-icon expired">&#9888;</div>' +
    '<div class="verify-title">Link Expired</div>' +
    '<div class="verify-message">' + escapeHtml(data.error) + '</div>' +
  '</div>';
}

function renderRevoked() {
  return '<div class="verify-card">' +
    '<div class="verify-icon error">&#10007;</div>' +
    '<div class="verify-title">Link Revoked</div>' +
    '<div class="verify-message">This verification link has been revoked by the document owner.</div>' +
  '</div>';
}

function renderError(title, message) {
  return '<div class="verify-card">' +
    '<div class="verify-icon error">&#10007;</div>' +
    '<div class="verify-title">' + escapeHtml(title) + '</div>' +
    '<div class="verify-message">' + escapeHtml(message) + '</div>' +
  '</div>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
