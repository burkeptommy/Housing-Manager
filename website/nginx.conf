#
# service.getchez.com — Chez operator service desk.
#
# Listed BEFORE the default server so Vercel's Host header routing
# picks this block when the hostname matches. The root path `/` serves
# service.html (not index.html), the operator's daily landing surface.
# Every other path falls through to the same static asset tree shared
# with the default server (admin.css, admin.js, chez.css, favicons,
# etc.).
#
# Phase X (May 2026) — Until DNS is configured, operators can still
# reach the service desk via `getchez.com/service.html`; the catch-all
# `location /` in the default server block already resolves that via
# `try_files $uri $uri.html $uri/`.
#
server {
    listen 8080;
    server_name service.getchez.com;
    root /usr/share/nginx/html;
    index service.html;

    location / {
        try_files $uri $uri.html $uri/ /service.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /service.html;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Apple universal links require apple-app-site-association to be served
    # over HTTPS with Content-Type: application/json. Without this override
    # nginx serves the extensionless file as application/octet-stream and
    # iOS rejects the association.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Chez PWA manifest — served by Chez-branded pages via
    # <link rel="manifest" href="/manifest.webmanifest">.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, immutable";
        expires 30d;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}
