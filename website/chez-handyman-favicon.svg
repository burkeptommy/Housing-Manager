<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Salmon background, rounded square — matches the chez-handyman-logo.png brand mark -->
  <rect width="100" height="100" rx="22" fill="#ED6955"/>
  <!-- Cream wrench mark above the c -->
  <g stroke="#FAF7F1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M30 36 L48 36 M52 36 L70 36"/>
    <circle cx="50" cy="36" r="3.5" fill="#FAF7F1" stroke="none"/>
  </g>
  <!-- Lowercase serif c — same letterform as the homeowner mark, salmon→cream variant -->
  <text x="50" y="84"
        font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
        font-size="62"
        font-weight="500"
        fill="#FAF7F1"
        text-anchor="middle">c</text>
</svg>
