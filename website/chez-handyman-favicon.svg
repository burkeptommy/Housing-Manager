<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Mirror of the iOS HavenFieldAppIcon.appiconset/AppIcon-1024.png design.
       Salmon rounded square, uppercase serif "C" centered slightly low,
       small indigo roof chevron above. -->
  <!-- Full-edge salmon. No rounded corners — matches the iOS app icon
       SOURCE PNG (Apple adds the rounded corner mask at display time). -->
  <rect width="100" height="100" fill="#ED6955"/>
  <!-- Indigo chevron, same geometry as the homeowner mark, color flipped. -->
  <path d="M55 28 L66 18 L77 28"
        stroke="#453A70" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Uppercase serif C in white. -->
  <text x="50" y="80"
        font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
        font-size="62"
        font-weight="500"
        fill="#FFFFFF"
        text-anchor="middle">C</text>
</svg>
