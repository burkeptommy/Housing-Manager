<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chez · Service</title>
    <meta
      name="description"
      content="The Chez operator desk. Every homeowner request, every household Chez manages, in one focused surface."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#6938EF" />
    <!-- Same favicon set as the rest of getchez.com. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=6" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=6" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=6" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png?v=6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />
    <!-- service.css @imports /chez.css for brand tokens, then layers the
         svc-* portal system on top. No admin.css, no admin.js: the service
         portal is its own ES-module app under /service/. -->
    <link rel="stylesheet" href="/service.css" />
  </head>
  <body>
    <div id="svc-root" class="svc-root">
      <!-- Boot spinner: visible until auth resolves. -->
      <div class="svc-loading" data-svc-loading>
        <span class="svc-wordmark" aria-hidden="true">chez</span>
        <span class="svc-spinner" aria-hidden="true"></span>
        <p class="svc-loading__text">Waking the desk…</p>
      </div>

      <!-- Sign in -->
      <section class="svc-gatewrap" data-svc-login hidden>
        <div class="svc-gatecard">
          <span class="svc-wordmark">chez</span>
          <p class="svc-eyebrow">Operator portal</p>
          <h1 class="svc-gatecard__title">Service</h1>
          <p class="svc-gatecard__lede">
            The daily desk for every home Chez manages. Sign in to pick up the queue.
          </p>
          <form class="svc-gatecard__form" data-svc-login-form>
            <label class="svc-field">
              <span>Email</span>
              <input
                class="svc-input"
                data-svc-login-email
                type="email"
                autocomplete="username"
                spellcheck="false"
                required
              />
            </label>
            <label class="svc-field">
              <span>Password</span>
              <input
                class="svc-input"
                data-svc-login-password
                type="password"
                autocomplete="current-password"
                required
              />
            </label>
            <button type="submit" class="svc-btn svc-btn--primary svc-btn--block" data-svc-login-submit>
              Open the desk
            </button>
            <p class="svc-gatecard__feedback" data-svc-login-feedback role="alert"></p>
          </form>
          <p class="svc-gatecard__footnote">
            Operator allowlist enforced server side.
          </p>
        </div>
      </section>

      <!-- Gate: allowlist denial or a boot failure, with one clear action. -->
      <section class="svc-gatewrap" data-svc-gate hidden>
        <div class="svc-gatecard">
          <span class="svc-wordmark">chez</span>
          <h1 class="svc-gatecard__title svc-gatecard__title--gate" data-svc-gate-title></h1>
          <p class="svc-gatecard__lede" data-svc-gate-body></p>
          <button type="button" class="svc-btn svc-btn--primary" data-svc-gate-action></button>
        </div>
      </section>

      <!-- App shell: fixed nav rail + full-height view host. Views own their
           scrolling; #svc-view itself never scrolls. -->
      <div class="svc-app" data-svc-app hidden>
        <aside class="svc-rail">
          <a class="svc-rail__brand" href="#/today" aria-label="Chez service, back to Today">
            <span class="svc-wordmark svc-wordmark--rail">chez</span>
            <span class="svc-rail__brand-tag">service</span>
          </a>
          <nav class="svc-rail__nav" data-svc-nav aria-label="Portal"></nav>
          <div class="svc-rail__footer">
            <span class="svc-rail__email" data-svc-session-email></span>
            <button type="button" class="svc-btn svc-btn--ghost svc-btn--small" data-svc-sign-out>
              Sign out
            </button>
          </div>
        </aside>
        <main class="svc-main">
          <div id="svc-view" class="svc-view"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/service/main.js"></script>
  </body>
</html>
