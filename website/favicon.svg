<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Mirror of the iOS AppIcon.appiconset/AppIcon-1024.png design.
       Indigo rounded square, uppercase serif "C" centered slightly low,
       small salmon roof chevron above (like a ^ accent on Ĉ). -->
  <!-- Full-edge indigo. The rect bleeds 2 units past the viewBox on every
       side so sub-pixel anti-aliasing at small favicon sizes (16/32px in
       browser tabs) has solid indigo to sample at the edges, instead of
       fading to transparent and letting the tab background show as a
       white halo around the icon. No explicit width/height so browsers
       scale purely from the viewBox. -->
  <rect x="-2" y="-2" width="104" height="104" fill="#453A70"/>
  <!-- Salmon chevron — small, sits above the C. Coords keep the chevron
       clear of the C's top edge. -->
  <path d="M55 28 L66 18 L77 28"
        stroke="#ED6955" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Uppercase serif C, sized so its cap top sits below the chevron. -->
  <text x="50" y="80"
        font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
        font-size="62"
        font-weight="500"
        fill="#FFFFFF"
        text-anchor="middle">C</text>
</svg>
