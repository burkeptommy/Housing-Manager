<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph / Twitter card image. Matches the iOS app icon
       (indigo background, uppercase serif C, salmon roof chevron).
       1200x630 = Facebook standard, also works for Twitter/Linked In. -->

  <!-- Background -->
  <rect width="1200" height="630" fill="#453A70"/>

  <!-- Left side: app icon (C + chevron) inside a rounded square card -->
  <g transform="translate(100, 145)">
    <rect width="340" height="340" rx="68" fill="#3B3162"/>
    <!-- Salmon chevron over the C -->
    <path d="M205 60 L255 95 L305 60"
          stroke="#ED6955" stroke-width="22" stroke-linecap="round"
          stroke-linejoin="round" fill="none"/>
    <!-- Uppercase serif C -->
    <text x="170" y="290"
          font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
          font-size="320"
          font-weight="500"
          fill="#FFFFFF"
          text-anchor="middle">C</text>
  </g>

  <!-- Right side: Chez wordmark + tagline -->
  <g transform="translate(540, 0)">
    <text x="0" y="290"
          font-family="ui-serif, 'New York', Georgia, 'Times New Roman', serif"
          font-size="120"
          font-weight="600"
          fill="#FFFFFF">Chez</text>
    <text x="0" y="365"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="34"
          font-weight="500"
          fill="#FFFFFF"
          opacity="0.85">Your home, organized.</text>
    <text x="0" y="430"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="22"
          font-weight="400"
          fill="#FFFFFF"
          opacity="0.7">Estate intelligence + home management,</text>
    <text x="0" y="460"
          font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="22"
          font-weight="400"
          fill="#FFFFFF"
          opacity="0.7">designed for the families who run their own.</text>
  </g>

  <!-- Footer URL -->
  <text x="600" y="585"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif"
        font-size="20"
        font-weight="500"
        fill="#FFFFFF"
        opacity="0.6"
        text-anchor="middle">getchez.com</text>
</svg>
