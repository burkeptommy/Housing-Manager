name: Haven
options:
  bundleIdPrefix: com.havenhome
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: RW9CWCAWGQ
    SWIFT_VERSION: "5.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Haven:
    type: application
    platform: iOS
    sources:
      - path: Haven
        excludes:
          - "Config/Info.plist"
          - "Config/Haven.entitlements"
          - "Config/HavenField-Info.plist"
          - "Resources/SplashScreen.storyboard"
          # Chez v1: HavenFieldApp.swift declares its own @main and is intended
          # for a separate Field-app target. Excluded here so the homeowner
          # Haven target builds cleanly. HavenFieldView.swift (model types
          # consumed by AppState/ContentView) stays in the target.
          - "App/HavenFieldApp.swift"
    resources:
      - path: Haven/Resources/Assets.xcassets
      - path: Haven/Resources/Fonts
      # Phase 67I.4: bundled remote-config JSON snapshots. Synced from
      # website/admin-data/ via scripts/sync-bundled-config.mjs before
      # each release so the iOS app ships with the latest server copy.
      # Bundled flat (group) so Bundle.main.url(forResource:withExtension:)
      # resolves files by base name without a subdirectory hint.
      - path: Haven/Resources/RemoteConfig
        type: group
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenhome.app
        INFOPLIST_FILE: Haven/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Haven/Config/Haven.entitlements
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "97"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Chez
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Haven/Config/Haven.entitlements
      properties:
        # Sign in with Apple. Without this, ASAuthorizationController fails
        # with AuthorizationError 1000 ("unknown") because the system has no
        # record of this app being allowed to use the Sign in with Apple
        # capability. The App ID in Apple Developer Portal must also have
        # Sign in with Apple enabled — that's the server-side half. Both
        # are required.
        com.apple.developer.applesignin:
          - Default
        # Push notifications. "development" for dev/TestFlight builds,
        # "production" gets injected automatically by the App Store distribution
        # provisioning profile when the app is exported for App Store release.
        aps-environment: development
        # Universal links. getchez.com is the new canonical domain; havenhome.dev
        # entries are kept so invite links sent before the domain switch still
        # open the app. api.* entries cover any future webhook callback paths.
        com.apple.developer.associated-domains:
          - applinks:getchez.com
          - applinks:www.getchez.com
          - applinks:api.getchez.com
          - applinks:havenhome.dev
          - applinks:api.havenhome.dev
        # iOS Simulator keychain note (2026-05-08): the Supabase Swift
        # SDK's default KeychainLocalStorage cannot persist auth session
        # tokens on iOS Simulator without proper provisioning — the
        # Security framework returns errSecMissingEntitlement (-34018).
        # Adding a literal keychain-access-groups here breaks simulator
        # launch because iOS validates the team prefix (which is missing
        # on unsigned simulator builds). The fix lives in code instead:
        # HavenSimulatorAuthStorage in Haven/Core/Networking/SupabaseClient.swift
        # swaps the SDK's storage backend to UserDefaults under
        # #if targetEnvironment(simulator). Device + TestFlight + App Store
        # builds keep using the secure Keychain path unchanged.

  HavenField:
    type: application
    platform: iOS
    sources:
      - path: Haven
        excludes:
          - "Config/Info.plist"
          - "Config/Haven.entitlements"
          - "Config/HavenField-Info.plist"
          - "Resources/SplashScreen.storyboard"
          # Separate field app target: include HavenFieldApp.swift and exclude
          # the homeowner @main so the standalone technician app owns launch.
          - "App/HavenApp.swift"
    resources:
      - path: Haven/Resources/Assets.xcassets
      - path: Haven/Resources/Fonts
      # Phase 67I.4: bundled remote-config JSON snapshots (same as
      # the homeowner Haven target — field app reads the same config).
      - path: Haven/Resources/RemoteConfig
        type: group
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenhome.field
        INFOPLIST_FILE: Haven/Config/HavenField-Info.plist
        CODE_SIGN_ENTITLEMENTS: Haven/Config/Haven.entitlements
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "86"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: ChezField
        ASSETCATALOG_COMPILER_APPICON_NAME: HavenFieldAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"

  HavenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HavenTests
    dependencies:
      - target: Haven
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chez.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Chez"
        GENERATE_INFOPLIST_FILE: true

schemes:
  Chez:
    build:
      targets:
        Haven: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
  Chez Field:
    build:
      targets:
        HavenField: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
