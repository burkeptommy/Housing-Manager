name: Haven
options:
  bundleIdPrefix: com.havenhome
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: RW9CWCAWGQ
    SWIFT_VERSION: "5.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Haven:
    type: application
    platform: iOS
    sources:
      - path: Haven
        excludes:
          - "Config/Info.plist"
          - "Config/Haven.entitlements"
          - "Resources/SplashScreen.storyboard"
    resources:
      - path: Haven/Resources/Assets.xcassets
      - path: Haven/Resources/Fonts
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.havenhome.app
        INFOPLIST_FILE: Haven/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Haven/Config/Haven.entitlements
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "86"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: Haven/Config/Haven.entitlements
      properties:
        # Sign in with Apple. Without this, ASAuthorizationController fails
        # with AuthorizationError 1000 ("unknown") because the system has no
        # record of this app being allowed to use the Sign in with Apple
        # capability. The App ID in Apple Developer Portal must also have
        # Sign in with Apple enabled — that's the server-side half. Both
        # are required.
        com.apple.developer.applesignin:
          - Default
        # Push notifications. "development" for dev/TestFlight builds,
        # "production" gets injected automatically by the App Store distribution
        # provisioning profile when the app is exported for App Store release.
        aps-environment: development
        # Universal links. Both domains are needed because havenhome.dev hosts
        # the marketing site and api.havenhome.dev (when configured) hosts the
        # webhook callback paths.
        com.apple.developer.associated-domains:
          - applinks:havenhome.dev
          - applinks:api.havenhome.dev

  HavenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HavenTests
    dependencies:
      - target: Haven
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Haven.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Haven"
        GENERATE_INFOPLIST_FILE: true
