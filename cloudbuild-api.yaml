# Cloud Build configuration for Haven API
# This file tells Google Cloud Build how to build and deploy the API

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/haven-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/haven-api:latest'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/haven-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/haven-api:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'haven-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/haven-api:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:us-central1:haven-production-db'
      - '--set-env-vars'
      - '^@^NODE_ENV=production@GCP_PROJECT_ID=$PROJECT_ID@GCS_BUCKET_NAME=$PROJECT_ID-uploads@CORS_ORIGIN=https://havenhome.dev,https://www.havenhome.dev,http://localhost:3000'
      - '--set-secrets'
      - 'JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest,MAPS_KEY=MAPS_KEY:latest,MELISSA_API_KEY=MELISSA_API_KEY:latest'
      - '--memory'
      - '1Gi'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

# Store the built images
images:
  - 'gcr.io/$PROJECT_ID/haven-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/haven-api:latest'

# Build timeout (15 minutes)
timeout: '900s'

# Use Cloud Logging only (no GCS bucket required)
options:
  logging: CLOUD_LOGGING_ONLY
