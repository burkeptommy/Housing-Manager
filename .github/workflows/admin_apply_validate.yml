name: Admin Apply Validate

# Headless xcodebuild for the working branch. Triggered on pushes that
# touch Swift sources. After build, posts back to Supabase to mark any
# admin_codex_notes rows whose applied_commit matches this SHA as
# success / failed. Closes the safety-net loop on Claude-applied
# proposals: if I ship a typo, the note flips red in Tom's Activity feed.

on:
  push:
    branches:
      - claude/setup-monorepo-structure-01BAnndWeY6zCXMapoKmLMjG
    paths:
      - "Haven/**"
      - "HavenTests/**"
      - "Haven.xcodeproj/**"
      - ".github/workflows/admin_apply_validate.yml"
  workflow_dispatch:

concurrency:
  group: admin-apply-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          # The checked-in project.pbxproj uses object format 77 (Xcode 16+).
          # macos-15 runners ship multiple Xcode versions — pick the newest.
          LATEST=$(ls /Applications | grep -E '^Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "/Applications/$LATEST/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --show-sdk-path --sdk iphonesimulator || true

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen || true
          fi
          xcodegen --version || true

      - name: Regenerate Xcode project from project.yml
        run: |
          # Belt-and-suspenders: regenerate against the runner's Xcode so
          # we never hit "future project file format" mismatches even if
          # the checked-in xcodeproj got out of sync.
          if [ -f project.yml ] && command -v xcodegen >/dev/null; then
            xcodegen generate
          else
            echo "xcodegen not present or no project.yml — using checked-in .xcodeproj"
          fi

      - name: Build (Haven scheme)
        id: xcodebuild
        run: |
          set +e
          # generic/platform avoids hard-coding a simulator device name
          # so this keeps working as Apple ships new simulators.
          xcodebuild \
            -scheme Haven \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo "build_status=$STATUS" >> "$GITHUB_OUTPUT"
          tail -200 build.log > build_excerpt.log || true
          exit $STATUS
        continue-on-error: true

      - name: Setup Node (for posting back to Supabase)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Post validation status to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA_FULL: ${{ github.sha }}
          BUILD_STATUS: ${{ steps.xcodebuild.outputs.build_status }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not set — skipping post-back."
            exit 0
          fi
          STATUS_LABEL="success"
          if [ "$BUILD_STATUS" != "0" ]; then STATUS_LABEL="failed"; fi
          LOG_EXCERPT=$(tail -50 build_excerpt.log 2>/dev/null || echo "")
          node scripts/post_apply_validation.mjs "$STATUS_LABEL" "$GITHUB_SHA_FULL" "$LOG_EXCERPT" || true

      - name: Fail job if build failed
        if: steps.xcodebuild.outputs.build_status != '0'
        run: exit 1
