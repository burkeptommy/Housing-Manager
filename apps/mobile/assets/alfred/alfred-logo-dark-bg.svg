  <!-- Small sparkle left -->
  <path d="M19 60L20.2 63.5L24 64.5L20.2 65.5L19 69L17.8 65.5L14 64.5L17.8 63.5L19 60Z" fill="#c4a574" opacity="0.7"/>
  
  <!-- Tiny accent dots -->
  <circle cx="99" cy="42" r="1.5" fill="#c4a574" opacity="0.5"/>
  <circle cx="23" cy="51" r="1.5" fill="#c4a574" opacity="0.5"/>
</svg>
