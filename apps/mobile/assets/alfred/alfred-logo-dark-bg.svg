  <!-- A-frame house - White -->
  <path d="M60 12L99 96H84L60 45L36 96H21L60 12Z" fill="#ffffff"/>
  
  <!-- Inner warmth - Champagne -->
  <path d="M60 51L77 89H43L60 51Z" fill="#c4a574"/>
  
  <!-- Window cutout - dark -->
  <rect x="54" y="63" width="12" height="9" rx="1.5" fill="#0a1929"/>
  
  <!-- Door cutout - dark -->
  <rect x="56" y="75" width="8" height="14" rx="1.5" fill="#0a1929"/>
  
  <!-- Sparkles - Champagne -->
  <!-- Large sparkle top right -->
  <path d="M93 27L95.5 33.5L102 36L95.5 38.5L93 45L90.5 38.5L84 36L90.5 33.5L93 27Z" fill="#c4a574"/>
  
